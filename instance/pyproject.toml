[project]
name = "sloptweak-instance"
version = "0.1.0"
description = "SlopTweak instance-side sidecar (auth gate, proxy, heartbeat, watchdog)"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.3"]

[dependency-groups]
dev = ["pytest>=9", "pytest-aiohttp>=1.1", "mypy>=1.18", "ruff>=0.15"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"dev/*" = ["S310"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["sidecar.py", "build_assets.py", "dev", "tests"]
